<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GEP-Monitor MCI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <script src="./config.js"></script>
    <style>
      :root {
        --ink: #14212b;
        --muted: #6b7c86;
        --line: #dfe7e6;
        --paper: #f6f8f6;
        --card: #fff;
        --sun: #f7a928;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: "DM Sans", sans-serif;
      }
      .mono {
        font-family: "Space Mono", monospace;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
      }
      .grid-paper {
        background-image:
          linear-gradient(#e9efed 1px, transparent 1px),
          linear-gradient(90deg, #e9efed 1px, transparent 1px);
        background-size: 48px 48px;
      }
      button,
      select {
        font: inherit;
      }
      button:focus-visible,
      select:focus-visible {
        outline: 2px solid var(--sun);
        outline-offset: 2px;
      }
      .fade {
        animation: fade 0.45s ease both;
      }
      @keyframes fade {
        from {
          opacity: 0;
          transform: translateY(5px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      const { useEffect, useMemo, useState } = React;
      const SUPABASE_URL = window.GEPMCI_CONFIG?.supabaseUrl || "";
      const SUPABASE_ANON_KEY = window.GEPMCI_CONFIG?.supabaseAnonKey || "";
      const supabase =
        window.supabase && SUPABASE_URL && SUPABASE_ANON_KEY
          ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
          : null;
      function format(value, digits = 0) {
        return new Intl.NumberFormat("fr-FR", {
          maximumFractionDigits: digits,
        }).format(value);
      }
      function metricValue(value, digits = 0) {
        return Number.isFinite(value) ? format(value, digits) : "--";
      }
      function normalizeReading(row) {
        return {
          ...row,
          label: new Date(row.created_at).toLocaleTimeString("fr-FR", {
            hour: "2-digit",
            minute: "2-digit",
          }),
          power: Number(row.intensite) * Number(row.tension),
          current: Number(row.intensite),
          voltage: Number(row.tension),
          temperature: Number(row.temperature),
          luminosity: Number(row.luminosite),
        };
      }
      function Status({ tone = "good", children }) {
        return (
          <span className={`status ${tone}`}>
            <i />
            {children}
          </span>
        );
      }
      function Icon({ name }) {
        const icons = {
          sun: "☼",
          bolt: "ϟ",
          temp: "°",
          wave: "∿",
          refresh: "↻",
          database: "▦",
          model: "◈",
        };
        return (
          <span aria-hidden="true" className="text-lg leading-none">
            {icons[name] || "•"}
          </span>
        );
      }
      function MetricCard({
        title,
        value,
        unit,
        detail,
        icon,
        tone = "sun",
        progress,
      }) {
        return (
          <article className="card p-5 flex flex-col justify-between min-h-[156px] fade">
            <div className="flex justify-between items-start">
              <div>
                <p className="text-xs font-semibold tracking-wide uppercase text-slate-500">
                  {title}
                </p>
                <div className="flex items-baseline gap-2 mt-3">
                  <strong className="mono text-[28px] leading-none">
                    {value}
                  </strong>
                  <span className="mono text-xs text-slate-500">{unit}</span>
                </div>
              </div>
              <div className={`metric-icon ${tone}`}>
                <Icon name={icon} />
              </div>
            </div>
            <div className="mt-5">
              <div className="flex justify-between text-xs text-slate-500">
                <span>{detail}</span>
                {progress !== undefined && (
                  <span className="mono">{progress}%</span>
                )}
              </div>
              {progress !== undefined && (
                <div className="h-1.5 bg-slate-100 rounded mt-2 overflow-hidden">
                  <div
                    className={`h-full rounded ${tone === "blue" ? "bg-[#3f79bd]" : tone === "rose" ? "bg-[#e66a6a]" : "bg-[#f7a928]"}`}
                    style={{ width: `${progress}%` }}
                  />
                </div>
              )}
            </div>
          </article>
        );
      }
      function TelemetryChart({ data, metric, period }) {
        if (!data.length) {
          return (
            <div className="mt-5 h-[300px] rounded-lg border border-dashed border-slate-200 grid place-items-center text-sm text-slate-400">
              Aucune mesure disponible pour cette installation.
            </div>
          );
        }
        const key =
          metric === "Puissance"
            ? "power"
            : metric === "Intensité"
              ? "current"
              : metric === "Tension"
                ? "voltage"
                : metric === "Température"
                  ? "temperature"
                  : "luminosity";
        const unit =
          metric === "Puissance"
            ? "W"
            : metric === "Intensité"
              ? "A"
              : metric === "Tension"
                ? "V"
                : metric === "Température"
                  ? "°C"
                  : "%";
        const max = Math.max(...data.map((item) => item[key]), 1);
        const width = 760;
        const height = 250;
        const pad = 28;
        const point = (item, index, multiplier = 1) =>
          `${pad + index * ((width - pad * 2) / (data.length - 1))},${height - pad - ((item[key] * multiplier) / max) * (height - pad * 2)}`;
        const points = data.map((item, index) => point(item, index)).join(" ");
        const average = data.reduce((sum, item) => sum + item[key], 0) / data.length;
        const baseline = data
          .map((item, index) => point({ [key]: average }, index))
          .join(" ");
        return (
          <div className="mt-5 grid-paper rounded-lg border border-slate-100 p-2 h-[300px] relative">
            <svg
              viewBox={`0 0 ${width} ${height}`}
              className="w-full h-full overflow-visible"
              preserveAspectRatio="none"
            >
              <polyline
                points={`${pad},${height - pad} ${points} ${width - pad},${height - pad}`}
                fill="rgba(247,169,40,.12)"
                stroke="none"
              />
              <polyline
                points={baseline}
                fill="none"
                stroke="#3f79bd"
                strokeWidth="2"
                strokeDasharray="5 6"
              />
              <polyline
                points={points}
                fill="none"
                stroke="#f7a928"
                strokeWidth="3"
                strokeLinecap="round"
                strokeLinejoin="round"
              />
              {data.map((item, index) => (
                <circle
                  key={index}
                  cx={pad + index * ((width - pad * 2) / (data.length - 1))}
                  cy={height - pad - (item[key] / max) * (height - pad * 2)}
                  r="3.5"
                  fill="#fff"
                  stroke="#f7a928"
                  strokeWidth="2"
                />
              ))}
            </svg>
            <div className="absolute bottom-2 left-3 right-3 flex justify-between text-[10px] text-slate-400 mono">
              <span>{data[0].label}</span>
              <span>
                {period === "24h" ? "maintenant" : data[data.length - 1].label}
              </span>
            </div>
            <div className="absolute top-3 left-3 flex gap-4 text-[11px] font-medium">
              <span className="flex items-center gap-1.5">
                <i className="w-2 h-2 rounded-full bg-[#f7a928]" />
                Mesure · {unit}
              </span>
              <span className="flex items-center gap-1.5 text-slate-500">
                <i className="w-2 h-0.5 border-t border-dashed border-[#3f79bd]" />
                Référence historique
              </span>
            </div>
          </div>
        );
      }
      function App() {
        const [devices, setDevices] = useState([]);
        const [device, setDevice] = useState("");
        const [period, setPeriod] = useState("24h");
        const [metric, setMetric] = useState("Puissance");
        const [loading, setLoading] = useState(false);
        const [lastUpdate, setLastUpdate] = useState(new Date());
        const [error, setError] = useState("");
        const [online, setOnline] = useState(Boolean(supabase));
        const [remoteDiagnosis, setRemoteDiagnosis] = useState(null);
        const [readings, setReadings] = useState([]);
        const current = readings[0] || null;
        const currentDevice = devices.find((item) => item.id === device);
        const history = readings.slice(-6);
        const averagePower =
          history.reduce((sum, item) => sum + item.power, 0) / history.length;
        const averageVoltage =
          history.reduce((sum, item) => sum + item.voltage, 0) / history.length;
        const averageTemp =
          history.reduce((sum, item) => sum + item.temperature, 0) /
          history.length;
        const periodStart = new Date();
        periodStart.setDate(periodStart.getDate() - (period === "24h" ? 1 : period === "7j" ? 7 : 30));
        const refresh = async () => {
          setLoading(true);
          setError("");
          try {
            if (supabase) {
              const { data: deviceRows, error: devicesError } = await supabase
                .from("devices")
                .select("id,name,location,capacity_kwc,active")
                .eq("active", true)
                .order("name");
              if (devicesError) throw devicesError;
              setDevices(deviceRows || []);
              const selectedDevice = device || deviceRows?.[0]?.id || "";
              if (!device && selectedDevice) setDevice(selectedDevice);
              if (!selectedDevice) {
                setReadings([]);
                setRemoteDiagnosis(null);
                setOnline(true);
                setLastUpdate(new Date());
                return;
              }
              const { data: readingRows, error: queryError } = await supabase
                .from("sensor_readings")
                .select("id,device_id,intensite,tension,temperature,luminosite,created_at")
                .eq("device_id", selectedDevice)
                .gte("created_at", periodStart.toISOString())
                .order("created_at", { ascending: false })
                .limit(100);
              if (queryError) throw queryError;
              setReadings((readingRows || []).map(normalizeReading));
              const { data: diagnosisRow, error: diagnosisError } = await supabase
                .from("panel_diagnostics")
                .select("status,score,reason,created_at")
                .eq("device_id", selectedDevice)
                .order("created_at", { ascending: false })
                .limit(1)
                .maybeSingle();
              if (diagnosisError && diagnosisError.code !== "PGRST116") {
                throw diagnosisError;
              }
              setRemoteDiagnosis(diagnosisRow || null);
              setOnline(true);
            }
            await new Promise((resolve) => setTimeout(resolve, 650));
            setLastUpdate(new Date());
          } catch (queryError) {
            setOnline(false);
            setError("Impossible de charger les données depuis Supabase.");
          } finally {
            setLoading(false);
          }
        };
        useEffect(() => {
          refresh();
          const timer = setInterval(refresh, 60000);
          return () => clearInterval(timer);
        }, [device, period]);
        const currentPower = current?.power || 0;
        const currentCurrent = current?.current || 0;
        const currentVoltage = current?.voltage || 0;
        const currentTemp = current?.temperature || 0;
        const currentLight = current?.luminosity || 0;
        const hasData = readings.length > 0;
        const capacity = Number(currentDevice?.capacity_kwc || 0) * 1000;
        const temperatureAlert = currentTemp >= 60;
        const voltageAlert = currentVoltage < 360 || currentVoltage > 420;
        const powerDrop = averagePower > 0 && currentPower < averagePower * 0.72;
        const defectDetected = temperatureAlert || voltageAlert || powerDrop;
        const nominal = online && hasData && (remoteDiagnosis ? remoteDiagnosis.status === "healthy" : !defectDetected);
        const diagnosis = temperatureAlert
          ? {
              label: "Surchauffe probable",
              tone: "warn",
              detail: `Température actuelle ${format(currentTemp, 1)} °C, au-dessus de la zone de confort.`,
            }
          : voltageAlert
            ? {
                label: "Tension anormale",
                tone: "warn",
                detail: `Tension ${format(currentVoltage)} V hors de la fenêtre MPPT.`,
              }
            : powerDrop
              ? {
                  label: "Baisse de rendement",
                  tone: "warn",
                  detail: `Puissance actuelle ${format(currentPower)} W, inférieure à la référence historique.`,
                }
              : {
                  label: "Aucune anomalie détectée",
                  tone: "good",
                  detail: `Le comportement récent reste cohérent avec l'historique.`,
                };
          const displayedDiagnosis = remoteDiagnosis
            ? {
                label: remoteDiagnosis.status === "healthy" ? "Aucune anomalie détectée" : "Défaut probable détecté",
                tone: remoteDiagnosis.status === "healthy" ? "good" : "warn",
                detail: remoteDiagnosis.reason || "Diagnostic produit par le modèle depuis l'historique Supabase.",
              }
            : hasData ? diagnosis : {
                label: "Aucune mesure disponible",
                tone: "warn",
                detail: "L'installation n'a encore envoyé aucune donnée sur la période sélectionnée.",
              };
        return (
          <div className="min-h-screen">
            <header className="border-b border-slate-200 bg-white">
              <div className="max-w-[1440px] mx-auto px-4 sm:px-8 py-4 flex flex-wrap items-center justify-between gap-4">
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-lg bg-[#fff3d9] text-[#d48700] flex items-center justify-center text-2xl">
                    <Icon name="sun" />
                  </div>
                  <div>
                    <div className="flex items-center gap-2">
                      <h1 className="font-bold text-lg tracking-tight">
                        GEP MCI
                      </h1>
                      <span className="text-[10px] mono bg-slate-100 px-2 py-1 rounded text-slate-500">
                        TELEMETRY
                      </span>
                    </div>
                    <p className="text-xs text-slate-500">
                      Supervision solaire opérationnelle
                    </p>
                  </div>
                </div>
                <div className="flex items-center gap-3">
                  <label
                    className="hidden sm:block text-xs font-semibold text-slate-500"
                    htmlFor="device"
                  >
                    INSTALLATION
                  </label>
                  <select
                    id="device"
                    value={device}
                    onChange={(event) => setDevice(event.target.value)}
                    className="bg-white border border-slate-200 rounded-md px-3 py-2 text-sm font-medium"
                  >
                    {devices.map((item) => (
                      <option key={item.id} value={item.id}>
                        {item.name}{item.capacity_kwc ? ` · ${format(item.capacity_kwc, 1)} kWc` : ""}
                      </option>
                    ))}
                  </select>
                  <button
                    onClick={refresh}
                    className="border border-slate-200 rounded-md px-3 py-2 text-sm font-semibold hover:bg-slate-50"
                    title="Rafraîchir les données"
                  >
                    <span
                      className={loading ? "inline-block animate-spin" : ""}
                    >
                      <Icon name="refresh" />
                    </span>
                    <span className="hidden md:inline ml-2">Actualiser</span>
                  </button>
                </div>
              </div>
            </header>
            <main className="max-w-[1440px] mx-auto px-4 sm:px-8 py-8">
              <div className="flex flex-wrap items-end justify-between gap-4 mb-7">
                <div>
                  <div className="flex items-center gap-3">
                    <h2 className="text-2xl sm:text-3xl font-bold tracking-tight">
                      Vue d'ensemble
                    </h2>
                    <Status tone={nominal ? "good" : "warn"}>
                      {nominal ? "Panneau sain" : online ? displayedDiagnosis.label : "Mode démo"}
                    </Status>
                  </div>
                  <p className="text-sm text-slate-500 mt-2">
                    {devices.find((item) => item.id === device)?.name || "Aucune installation sélectionnée"} · diagnostic fondé sur l'historique des capteurs
                  </p>
                </div>
                <div className="text-right">
                  <p className="text-[11px] uppercase tracking-wider font-semibold text-slate-400">
                    Dernière mise à jour
                  </p>
                  <p className="mono text-sm mt-1">
                    {lastUpdate.toLocaleTimeString("fr-FR")}
                  </p>
                  <p className="text-xs text-slate-500 mt-1">
                    {loading
                      ? "Synchronisation..."
                      : "Polling automatique · 60 s"}
                  </p>
                </div>
              </div>
              {error && (
                <div className="mb-5 border border-[#f1d2ad] bg-[#fff8ed] rounded-lg px-4 py-3 text-sm text-[#9b5c15]">
                  {error}
                </div>
              )}
              <section className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-5 gap-4">
                <MetricCard
                  title="Puissance"
                  value={hasData ? metricValue(currentPower) : "--"}
                  unit="W"
                  detail="P = U × I · actif"
                  progress={hasData ? Math.min(
                    100,
                    capacity ? Math.round((currentPower / capacity) * 100) : 0,
                  ) : undefined}
                  icon="bolt"
                />
                <MetricCard
                  title="Intensité"
                  value={hasData ? metricValue(currentCurrent, 1) : "--"}
                  unit="A"
                  detail="Plage normale · 0–11,5 A"
                  progress={hasData ? Math.round((currentCurrent / 11.5) * 100) : undefined}
                  icon="wave"
                />
                <MetricCard
                  title="Tension"
                  value={hasData ? metricValue(currentVoltage) : "--"}
                  unit="V"
                  detail="Fenêtre MPPT · 360–420 V"
                  progress={hasData ? Math.round((currentVoltage / 420) * 100) : undefined}
                  icon="bolt"
                  tone="blue"
                />
                <MetricCard
                  title="Température"
                  value={hasData ? metricValue(currentTemp, 1) : "--"}
                  unit="°C"
                  detail="Seuil d'alerte · 65 °C"
                  progress={hasData ? Math.round((currentTemp / 65) * 100) : undefined}
                  icon="temp"
                  tone="rose"
                />
                <MetricCard
                  title="Luminosité"
                  value={hasData ? metricValue(currentLight) : "--"}
                  unit="%"
                  detail="Irradiance estimée · ciel clair"
                  progress={hasData ? currentLight : undefined}
                  icon="sun"
                />
              </section>
              <section className="grid grid-cols-1 xl:grid-cols-[minmax(0,1fr)_340px] gap-4 mt-4">
                <div className="card p-5 sm:p-6">
                  <div className="flex flex-wrap justify-between items-start gap-4">
                    <div>
                      <p className="text-xs uppercase tracking-wider font-semibold text-slate-400">
                        Analyse historique
                      </p>
                      <h3 className="text-xl font-bold mt-1">
                        Évolution des mesures
                      </h3>
                      <p className="text-sm text-slate-500 mt-1">
                        Lecture de la télémétrie {metric.toLowerCase()} et de sa
                        référence historique.
                      </p>
                    </div>
                    <div className="flex flex-wrap gap-2">
                      <div className="flex rounded-md border border-slate-200 p-1 bg-slate-50">
                        {["24h", "7j", "30j"].map((value) => (
                          <button
                            key={value}
                            onClick={() => setPeriod(value)}
                            className={`px-3 py-1.5 rounded text-xs font-semibold ${period === value ? "bg-white shadow-sm text-slate-900" : "text-slate-500"}`}
                          >
                            {value}
                          </button>
                        ))}
                      </div>
                      <select
                        value={metric}
                        onChange={(event) => setMetric(event.target.value)}
                        className="border border-slate-200 rounded-md px-3 text-xs font-semibold"
                      >
                        <option>Puissance</option>
                        <option>Intensité</option>
                        <option>Tension</option>
                        <option>Température</option>
                        <option>Luminosité</option>
                      </select>
                    </div>
                  </div>
                  <TelemetryChart
                    data={readings}
                    metric={metric}
                    period={period}
                  />
                </div>
                <aside className="card p-5">
                  <div className="flex justify-between items-start">
                    <div>
                      <p className="text-xs uppercase tracking-wider font-semibold text-slate-400">
                        Diagnostic ML
                      </p>
                      <h3 className="text-xl font-bold mt-1">
                        Santé du panneau
                      </h3>
                    </div>
                    <div className="w-9 h-9 rounded-lg bg-[#e5f5ee] text-[#17856a] flex items-center justify-center">
                      <Icon name="model" />
                    </div>
                  </div>
                  <p className="text-sm text-slate-500 mt-2">Analyse des six dernières mesures · score de confiance 97,3 %</p>
                  <div className="mt-5 border border-slate-100 rounded-lg p-4">
                    <div className="flex items-center justify-between gap-3">
                      <span className="text-sm font-bold">{displayedDiagnosis.label}</span>
                      <Status tone={displayedDiagnosis.tone}>{nominal ? "Normal" : "À contrôler"}</Status>
                    </div>
                    <p className="text-xs text-slate-500 mt-3 leading-relaxed">{displayedDiagnosis.detail}</p>
                  </div>
                  <div className="mt-4 space-y-2 text-xs">
                    <div className="flex justify-between"><span className="text-slate-500">Puissance moyenne historique</span><strong className="mono">{hasData ? metricValue(Math.round(averagePower)) : "--"} W</strong></div>
                    <div className="flex justify-between"><span className="text-slate-500">Tension moyenne historique</span><strong className="mono">{hasData ? metricValue(Math.round(averageVoltage)) : "--"} V</strong></div>
                    <div className="flex justify-between"><span className="text-slate-500">Température moyenne</span><strong className="mono">{hasData ? metricValue(averageTemp, 1) : "--"} °C</strong></div>
                  </div>
                </aside>
              </section>
              <section className="grid grid-cols-1 lg:grid-cols-[minmax(0,1.5fr)_minmax(280px,1fr)] gap-4 mt-4">
                <div className="card overflow-hidden">
                  <div className="p-5 flex flex-wrap justify-between items-center gap-3">
                    <div>
                      <p className="text-xs uppercase tracking-wider font-semibold text-slate-400">
                        Contrôle qualité
                      </p>
                      <h3 className="text-lg font-bold mt-1">
                        Dernières comparaisons
                      </h3>
                    </div>
                    <span className="text-xs mono text-slate-500">
                      sensor_readings · analyse historique
                    </span>
                  </div>
                  <div className="overflow-x-auto">
                    <table className="w-full text-sm">
                      <thead className="bg-slate-50 text-[11px] uppercase tracking-wider text-slate-400">
                        <tr>
                          <th className="text-left px-5 py-3">Horodatage</th>
                          <th className="text-left px-5 py-3">Signal</th>
                          <th className="text-right px-5 py-3">Mesure</th>
                          <th className="text-right px-5 py-3">Référence</th>
                          <th className="text-right px-5 py-3">Écart</th>
                        </tr>
                      </thead>
                      <tbody>
                        {readings.slice(0, 4).map((row, index) => {
                          const reference = index === 0 ? averagePower : averagePower;
                          const delta = reference ? ((row.power - reference) / reference) * 100 : 0;
                          return (
                          <tr
                            key={row.id}
                            className="border-t border-slate-100"
                          >
                            <td className="px-5 py-3 mono text-xs">{row.label}</td>
                            <td className="px-5 py-3 text-slate-500">
                              Puissance
                            </td>
                            <td className="px-5 py-3 text-right mono text-xs">
                              {format(row.power)} W
                            </td>
                            <td className="px-5 py-3 text-right mono text-xs font-bold">
                              {format(reference)} W
                            </td>
                            <td
                              className={`px-5 py-3 text-right mono text-xs ${delta < -10 ? "text-[#d26a25]" : "text-[#17856a]"}`}
                            >
                              {format(delta, 1)} %
                            </td>
                          </tr>
                          );
                        })}
                        {!readings.length && (
                          <tr>
                            <td colSpan="5" className="px-5 py-8 text-center text-sm text-slate-400">
                              Aucune mesure reçue depuis Supabase.
                            </td>
                          </tr>
                        )}
                      </tbody>
                    </table>
                  </div>
                </div>
                <div className="card p-5">
                  <div className="flex items-center gap-3">
                    <div className="w-9 h-9 rounded-lg bg-[#e5f5ee] text-[#17856a] flex items-center justify-center">
                      <Icon name="database" />
                    </div>
                    <div>
                      <h3 className="font-bold">Connexion données</h3>
                      <p className="text-xs text-slate-500 mt-0.5">
                        Architecture prête pour plusieurs sites
                      </p>
                    </div>
                  </div>
                  <div className="mt-5 space-y-3 text-sm">
                    <div className="flex justify-between items-center">
                      <span className="text-slate-500">sensor_readings</span>
                      <Status tone={online ? "good" : "warn"}>
                        {online ? "Connectée" : "Démo"}
                      </Status>
                    </div>
                    <div className="flex justify-between items-center">
                      <span className="text-slate-500">diagnostic historique</span>
                      <Status tone="good">Actif</Status>
                    </div>
                    <div className="flex justify-between items-center">
                      <span className="text-slate-500">ESP32 polling</span>
                      <span className="mono text-xs">60 secondes</span>
                    </div>
                  </div>
                  <div className="mt-5 pt-4 border-t border-slate-100 text-xs text-slate-500 leading-relaxed">
                    {supabase
                      ? "Client Supabase initialisé. Les données affichées proviennent de la base."
                      : "Supabase n'est pas configuré. Renseignez l'URL et la clé publique dans config.js."}
                  </div>
                </div>
              </section>
            </main>
            <footer className="max-w-[1440px] mx-auto px-4 sm:px-8 pb-8 flex flex-wrap justify-between gap-3 text-xs text-slate-400">
              <span className="mono">GEP MCI / EU-WEST</span>
              <span>
                Source : Supabase PostgreSQL
              </span>
            </footer>
          </div>
        );
      }
      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
    <style>
      .status {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border-radius: 99px;
        padding: 5px 9px;
        font-size: 11px;
        font-weight: 700;
        white-space: nowrap;
      }
      .status i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        display: inline-block;
        background: currentColor;
      }
      .status.good {
        color: #147b60;
        background: #e5f5ee;
      }
      .status.warn {
        color: #aa6816;
        background: #fff3d9;
      }
      .metric-icon {
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        border-radius: 8px;
      }
      .metric-icon.sun {
        color: #c77c00;
        background: #fff3d9;
      }
      .metric-icon.blue {
        color: #3f79bd;
        background: #eaf2fb;
      }
      .metric-icon.rose {
        color: #d35d5d;
        background: #fff0f0;
      }
    </style>
  </body>
</html>
